<label>
    bh_ks (odd) <span x-text="params.bh_ks"></span>
    <input type="range" min="1" max="61" step="2" x-model.number="params.bh_ks">
</label>
<label>
    bhm_iter <span x-text="params.bhm_iter"></span>
    <input type="range" min="1" max="20" step="1" x-model.number="params.bhm_iter">
</label>
<label>
    bhm_mult <span x-text="params.bhm_mult"></span>
    <input type="range" min="1" max="300" step="1" x-model.number="params.bhm_mult">
</label>
<label>
    cont_mult <span x-text="params.cont_mult"></span>
    <input type="range" min="0.1" max="10.0" step="0.1" x-model.number="params.cont_mult">
</label>
<label>
    Otsu classes <span x-text="params.otsu_classes"></span>
    <input type="range" min="2" max="10" step="1" x-model.number="params.otsu_classes">
</label>
<label>
    Class range low <span x-text="params.otsu_range_low"></span>
    <input type="range" min="0" :max="params.otsu_classes - 1" step="1" x-model.number="params.otsu_range_low">
</label>
<label>
    Class range high <span x-text="params.otsu_range_high"></span>
    <input type="range" min="0" :max="params.otsu_classes - 1" step="1" x-model.number="params.otsu_range_high">
</label>
<label>
    ws_ths_factor <span x-text="params.ws_ths_factor"></span>
    <input type="range" min="0.0001" max="0.2" step="0.0005" x-model.number="params.ws_ths_factor">
</label>
<label>
    ws_gl_vecinity <span x-text="params.ws_gl_vecinity"></span>
    <input type="range" min="1" max="200" step="1" x-model.number="params.ws_gl_vecinity">
</label>
