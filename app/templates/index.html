<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micrography Image Processor</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body x-data="{
    mode: 'simple',
    files: [],
    selected: null,
    params: {
        gamma: 1.0,
        otsu_classes: 5,
        otsu_range_low: 3,
        otsu_range_high: 4,
        cont_mult: 2.5,
        ws_ths_factor: 0.025,
        ws_gl_vecinity: 15,
        bh_ks: 7,
        bhm_iter: 4,
        bhm_mult: 60
    },
    loading: false
}">
    <div class="layout">
        <aside class="sidebar">
            <h1>Micrography</h1>

            <section>
                <h2>Mode</h2>
                <div class="mode-selector">
                    <button
                        :class="mode === 'simple' ? 'active' : ''"
                        @click="mode = 'simple'"
                    >Simple</button>
                    <button
                        :class="mode === 'pro' ? 'active' : ''"
                        @click="mode = 'pro'"
                    >Pro</button>
                </div>
            </section>

            <section>
                <h2>Upload</h2>
                <label class="btn">
                    Choose file(s)
                    <input
                        type="file"
                        accept=".jpg,.jpeg,.png,.tif"
                        multiple
                        style="display: none;"
                        @change="
                            const added = [];
                            for (const f of $event.target.files) {
                                if (!files.find(e => e.name === f.name)) {
                                    added.push({ name: f.name, file: f, url: URL.createObjectURL(f) });
                                }
                            }
                            files = [...files, ...added];
                            if (files.length && !selected) selected = files[0].name;
                        "
                    >
                </label>
            </section>

            <template x-if="files.length > 0">
                <section>
                    <h2>Images</h2>
                    <ul class="image-list">
                        <template x-for="f in files" :key="f.name">
                            <li
                                :class="selected === f.name ? 'active' : ''"
                                @click="selected = f.name"
                            >
                                <span x-text="f.name" class="image-name"></span>
                                <button
                                    class="remove-btn"
                                    @click.stop="
                                        URL.revokeObjectURL(f.url);
                                        files = files.filter(e => e.name !== f.name);
                                        if (selected === f.name) selected = files.length ? files[0].name : null;
                                    "
                                >&times;</button>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>

            <template x-if="selected">
                <section>
                    <h2>Parameters</h2>
                    <!-- simple mode params -->
                    <div x-show="mode === 'simple'">
                        {% include "params_simple.html" %}
                    </div>
                    <!-- pro mode params -->
                    <div x-show="mode === 'pro'">
                        {% include "params_pro.html" %}
                    </div>

                    <button
                        class="btn primary"
                        style="margin-top: 1rem;"
                        :disabled="loading"
                        @click="
                            const entry = files.find(f => f.name === selected);
                            if (!entry) return;
                            loading = true;
                            const fd = new FormData();
                            fd.append('image', entry.file);
                            fd.append('mode', mode);
                            fd.append('params', JSON.stringify(params));
                            fetch('/preview', { method: 'POST', body: fd })
                                .then(r => r.text())
                                .then(html => document.getElementById('preview-area').innerHTML = html)
                                .finally(() => loading = false);
                        "
                    >
                        <span x-show="!loading">Preview</span>
                        <span x-show="loading">Processing...</span>
                    </button>
                </section>
            </template>
        </aside>

        <main class="main-area">
            <template x-if="!selected">
                <p class="placeholder">image will appear here</p>
            </template>

            <template x-if="selected">
                <div class="preview-grid">
                    <div>
                        <h2>Input</h2>
                        <img :src="files.find(f => f.name === selected)?.url" alt="input">
                    </div>
                    <div>
                        <h2>Result</h2>
                        <div id="preview-area">
                            <p class="placeholder">click preview to process</p>
                        </div>
                    </div>
                </div>
            </template>
        </main>
    </div>
</body>
</html>
