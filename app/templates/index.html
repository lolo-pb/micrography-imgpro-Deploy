<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micrography Image Processor</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body x-data="{
    mode: 'simple',
    files: [],
    selected: null,
    params: {
        gamma: 1.0,
        otsu_classes: 5,
        otsu_range_low: 3,
        otsu_range_high: 4,
        cont_mult: 2.5,
        ws_ths_factor: 0.025,
        ws_gl_vecinity: 15,
        bh_ks: 7,
        bhm_iter: 4,
        bhm_mult: 60
    },
    loading: false,
    exporting: false
}">
    <div class="layout">
        <aside class="sidebar">
            <h1>Micrography</h1>

            <section>
                <h2>Mode</h2>
                <div class="mode-selector">
                    <button
                        :class="mode === 'simple' ? 'active' : ''"
                        @click="mode = 'simple'"
                    >Simple</button>
                    <button
                        :class="mode === 'pro' ? 'active' : ''"
                        @click="mode = 'pro'"
                    >Pro</button>
                </div>
            </section>

            <section>
                <h2>Upload</h2>
                <label class="btn">
                    Choose file(s)
                    <input
                        type="file"
                        accept=".jpg,.jpeg,.png,.tif"
                        multiple
                        style="display: none;"
                        @change="
                            const added = [];
                            for (const f of $event.target.files) {
                                if (!files.find(e => e.name === f.name)) {
                                    added.push({ name: f.name, file: f, url: URL.createObjectURL(f), resultHtml: null, exportResult: true, exportColoring: false, exportStats: false });
                                }
                            }
                            files = [...files, ...added];
                            if (files.length && !selected) selected = files[0].name;
                            $event.target.value = '';
                        "
                    >
                </label>
            </section>

            <template x-if="files.length > 0">
                <section>
                    <h2>Images</h2>
                    <ul class="image-list">
                        <template x-for="f in files" :key="f.name">
                            <li
                                :class="selected === f.name ? 'active' : ''"
                                @click="selected = f.name"
                            >
                                <span x-text="f.name" class="image-name"></span>
                                <button
                                    class="remove-btn"
                                    @click.stop="
                                        URL.revokeObjectURL(f.url);
                                        files = files.filter(e => e.name !== f.name);
                                        if (selected === f.name) selected = files.length ? files[0].name : null;
                                    "
                                >&times;</button>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>

            <template x-if="selected">
                <section>
                    <details>
                        <summary>Parameters</summary>
                        <div x-show="mode === 'simple'">
                            {% include "params_simple.html" %}
                        </div>
                        <div x-show="mode === 'pro'">
                            {% include "params_pro.html" %}
                        </div>
                    </details>

                    <button
                        class="btn primary"
                        style="margin-top: 1rem;"
                        :disabled="loading"
                        @click="
                            const entry = files.find(f => f.name === selected);
                            if (!entry) return;
                            loading = true;
                            const fd = new FormData();
                            fd.append('image', entry.file);
                            fd.append('mode', mode);
                            fd.append('params', JSON.stringify(params));
                            fetch('/preview', { method: 'POST', body: fd })
                                .then(r => r.text())
                                .then(html => {
                                    entry.resultHtml = html;
                                    document.getElementById('preview-area').innerHTML = html;
                                })
                                .finally(() => loading = false);
                        "
                    >
                        <span x-show="!loading">Preview</span>
                        <span x-show="loading">Processing...</span>
                    </button>
                </section>
            </template>

            <template x-if="files.length > 0">
                <section>
                    <h2>Export</h2>
                    <label class="export-option">
                        <input type="checkbox" :checked="files.find(f => f.name === selected)?.exportResult" @change="files.find(f => f.name === selected).exportResult = $event.target.checked"> Result
                    </label>
                    <label class="export-option">
                        <input type="checkbox" :checked="files.find(f => f.name === selected)?.exportColoring" @change="files.find(f => f.name === selected).exportColoring = $event.target.checked"> Coloring
                    </label>
                    <label class="export-option">
                        <input type="checkbox" :checked="files.find(f => f.name === selected)?.exportStats" @change="files.find(f => f.name === selected).exportStats = $event.target.checked"> Data (stats)
                    </label>
                    <button
                        class="btn primary"
                        style="margin-top: 0.75rem;"
                        :disabled="exporting"
                        @click="
                            exporting = true;
                            const fd = new FormData();
                            files.forEach(f => fd.append('images', f.file));
                            fd.append('mode', mode);
                            fd.append('params', JSON.stringify(params));
                            fd.append('export_flags', JSON.stringify(files.map(f => ({
                                result: f.exportResult,
                                coloring: f.exportColoring,
                                stats: f.exportStats
                            }))));
                            fetch('/batch-export', { method: 'POST', body: fd })
                                .then(r => r.blob())
                                .then(blob => {
                                    const a = document.createElement('a');
                                    a.href = URL.createObjectURL(blob);
                                    a.download = 'batch_results.zip';
                                    a.click();
                                    URL.revokeObjectURL(a.href);
                                })
                                .finally(() => exporting = false);
                        "
                    >
                        <span x-show="!exporting">Process & Download All</span>
                        <span x-show="exporting">Processing...</span>
                    </button>
                </section>
            </template>
        </aside>

        <main class="main-area">
            <template x-if="!selected">
                <p class="placeholder">image will appear here</p>
            </template>

            <template x-if="selected">
                <div class="preview-grid">
                    <div>
                        <h2>Input</h2>
                        <img :src="files.find(f => f.name === selected)?.url" alt="input">
                    </div>
                    <div>
                        <h2>Result</h2>
                        <div id="preview-area"
                            x-effect="
                                const entry = files.find(f => f.name === selected);
                                const area = document.getElementById('preview-area');
                                if (area) area.innerHTML = entry?.resultHtml || '<p class=&quot;placeholder&quot;>click preview to process</p>';
                            "
                        >
                    </div>
                </div>
            </template>
        </main>
    </div>
</body>
</html>
